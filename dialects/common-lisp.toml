extensions = ["lisp", "lsp", "cl", "l", "asd", "ros"]
language_ids = ["lisp", "commonlisp", "common-lisp"]
modeline_names = ["lisp", "common-lisp", "common lisp"]
case_sensitive = false
namespace_separators = ["::", ":"]
keyword_prefixes = [":"]
namespace_forms = ["in-package"]
def_prefixes = ["def", "define-"]
pattern_ignore = ["&optional", "&rest", "&key", "&aux", "&body", "&whole", "&environment", "&allow-other-keys", "."]
data_forms = ["quote", "declare", "declaim", "proclaim", "defpackage", "defclass", "define-condition", "defstruct", "deftype", "case", "ecase", "ccase", "typecase", "etypecase", "ctypecase", "cond", "handler-case", "handler-bind", "restart-case", "restart-bind", "loop", "eval-when", "defgeneric"]
constants = ["nil", "t"]

[reader]
brackets = ["()"]
line_comment = ";"
block_comment = ["#|", "|#"]
nested_block_comments = true
char_prefix = "#\\"
symbol_bars = true
symbol_escape = true
terminators = "'`,"
sharp_dispatch = true

[reader.prefixes]
"'" = 1
"`" = 1
"," = 1
",@" = 1
",." = 1
"#'" = 1
"#." = 1
"#+" = 2
"#-" = 2

[defs]
defun = { kind = "function", params = 2 }
defmacro = { kind = "macro", params = 2 }
define-compiler-macro = { kind = "macro", params = 2 }
define-modify-macro = { kind = "macro", params = 2 }
define-symbol-macro = { kind = "macro" }
defgeneric = { kind = "interface", params = 2 }
defmethod = { kind = "method", params = "list" }
defvar = { kind = "variable", doc = 3 }
defparameter = { kind = "variable", doc = 3 }
defconstant = { kind = "constant", doc = 3 }
defclass = { kind = "class" }
define-condition = { kind = "class" }
defstruct = { kind = "struct" }
deftype = { kind = "type", params = 2 }
defpackage = { kind = "module" }
define-method-combination = { kind = "function" }
defsetf = { kind = "function" }
define-setf-expander = { kind = "function", params = 2 }

[bindings]
let = "let"
"let*" = "let"
do = "let"
"do*" = "let"
prog = "let"
"prog*" = "let"
symbol-macrolet = "let"
lambda = "lambda"
destructuring-bind = "bind"
multiple-value-bind = "bind"
dolist = "single"
dotimes = "single"
do-symbols = "single"
do-external-symbols = "single"
do-all-symbols = "single"
with-open-file = "single"
with-open-stream = "single"
with-input-from-string = "single"
with-output-to-string = "single"
with-slots = "bind"
with-accessors = "bind"
flet = "flet"
labels = "flet"
macrolet = "flet"

[indent]
defun = 2
defmacro = 2
defgeneric = 2
defmethod = 2
defclass = 2
defstruct = 1
defpackage = 1
lambda = 1
let = 1
"let*" = 1
flet = 1
labels = 1
macrolet = 1
symbol-macrolet = 1
destructuring-bind = 2
multiple-value-bind = 2
when = 1
unless = 1
if = 2
block = 1
catch = 1
case = 1
ecase = 1
ccase = 1
typecase = 1
etypecase = 1
ctypecase = 1
handler-case = 1
handler-bind = 1
restart-case = 1
unwind-protect = 1
dolist = 1
dotimes = 1
do = 2
"do*" = 2
progn = 0
prog1 = 1
prog2 = 2
tagbody = 0
eval-when = 1
return-from = 1
print-unreadable-object = 1

[indent_prefixes]
"def" = 2
"with-" = 1
"do-" = 1

